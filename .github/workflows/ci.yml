name: E-Commerce CI

on:
  push:
    branches:
      - feature/e-commerce-app
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main


jobs:

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.generate-tag.outputs.tag }}

    steps:
      - name: Generate Tag
        id: generate-tag
        run: |
          TAG="dev-$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "Generated tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm test


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - backend-test
      - frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Generated Tag
        run: |
          echo "Docker image tag:"
          echo "${{ needs.detect-changes.outputs.tag }}"

      - name: Build backend Docker image
        run: |
          docker build \
            -t ecommerce-backend:${{ needs.detect-changes.outputs.tag }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ecommerce-frontend:${{ needs.detect-changes.outputs.tag }} \
            ./frontend


  auto-merge-develop:
    name: Auto Merge to Develop
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - backend-test
      - frontend-build
      - docker-build

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Show Release Tag
        run: |
          echo "Release tag: ${{ needs.detect-changes.outputs.tag }}"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --delete-branch=false