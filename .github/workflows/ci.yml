name: E-Commerce CI

on:
  push:
    branches:
      - feature/e-commerce-app
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm test


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t ecommerce-backend:test \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ecommerce-frontend:test \
            ./frontend